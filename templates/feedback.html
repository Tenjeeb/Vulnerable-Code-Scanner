<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - Vulnerable Code Scanner</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{url_for('static', filename='css/style.css') }}">

    <style>
        /* Feedback Section Styles */
        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;  
            border-radius: 10px;
            background-color: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
    
        .container h1 {
            text-align: center;
            color: #333;
        }
    
        #feedbackForm {
            display: flex;
            flex-direction: column;
        }
    
        .form-group {
            margin-top: 10px;
        }
    
        .form-group label {
            font-weight: bold;
            color: #555;
        }
    
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
    
        .form-group textarea {
            resize: vertical;
            height: 100px;
        }
    
        #feedbackForm button {
            margin-top: 20px;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
    
        #feedbackForm button:hover {
            background-color: #218838;
        }
        
        @media (max-width: 768px) {
    
    /* Feedback page specific adjustments */
    .container {
        width: 90%;
        margin: 15px auto;
        padding: 15px;
    }
    
    .form-group input,
    .form-group select,
    .form-group textarea {
        font-size: 14px;
    }
    
    .form-group textarea {
        height: 80px; /* Slightly smaller on mobile */
    }
    
    #feedbackForm button {
        padding: 12px; /* Larger tap target */
    }
}
</style>

</head>
<body>
    
    <!------Navigation bar --->
    <nav class="nav">
        <div class="logo">
            <img src="{{url_for('static', filename='images/logo.png')}}" alt="logo" class="logo-img">  <!--logo-->
        </div>
        <div class="nav-links">
            <a href="/" class="nav-link">Home</a>       
            <a href="/feedback" class="nav-link">Feedback form</a>
            <a href="/add_patterns" class="nav-link">Add Patterns</a>
        </div>

    </nav>
 
    <div class="container">
        <h1>Feedback</h1>
        <form id="feedbackForm">
            <!-- Name -->
            <div class="form-group">
                <label for="name" class="required">Name</label>
                <input type="text" id="name" name="name" required>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email" class="required">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <!-- Role -->
            <div class="form-group">
                <label for="role">Role</label>
                <select id="role" name="role">
                    <option value="">Select your role</option>
                    <option value="developer">Developer</option>
                    <option value="security_engineer">Security Engineer</option>
                    <option value="devops">DevOps</option>
                    <option value="manager">Manager</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <!-- False Positives -->
            <div class="form-group">
                <label for="falsePositives" class="required">Did you encounter any false positives?</label>
                <select id="falsePositives" name="falsePositives" required>
                    <option value="">Please select</option>
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                    <option value="unsure">Unsure</option>
                </select>
            </div>

            <!-- False Positives Details -->
            <div class="form-group">
                <label for="falsePositivesDetails">If yes, please provide details:</label>
                <textarea id="falsePositivesDetails" name="falsePositivesDetails"></textarea>
            </div>

            <!-- Missed Vulnerabilities -->
            <div class="form-group">
                <label for="falseNegatives" class="required">Did you notice any missed vulnerabilities?</label>
                <select id="falseNegatives" name="falseNegatives" required>
                    <option value="">Please select</option>
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                    <option value="unsure">Unsure</option>
                </select>
            </div>

            <!-- Missed Vulnerabilities Details -->
            <div class="form-group">
                <label for="falseNegativesDetails">If yes, please provide details:</label>
                <textarea id="falseNegativesDetails" name="falseNegativesDetails"></textarea>
            </div>

            <!-- Additional Features -->
            <div class="form-group">
                <label for="features">Are there any additional features you would like to see?</label>
                <textarea id="features" name="features"></textarea>
            </div>

                <!-- Submit Button -->
            <button type="submit">Submit Feedback</button>
        </form>
    </div>

    
     <!-- Footer Section -->
     <footer class="footer">
        <div class="footer-content">
        <p><strong>&copy; 2025 Vulnerable Code Scanner. All rights reserved.</strong></p>
        
        <!-- Footer Text Without Links (Except GitHub) -->
        <div class="footer-links">
            <ul>
                <li>Privacy Policy</li>
                <li>Terms of Service</li>
                <li><a href="https://github.com/Tenjeeb/Vulnerable-Code-Scanner" target="_blank" aria-label="GitHub" class="github-link">GitHub</a></li>
                <li>Contact Us</li>
            </ul>
        </div>

        <!-- Social Media icons -->
        <div class="social-media">
            <a aria-label="Twitter">
                <i class="fab fa-twitter"></i>
            </a>
            <a aria-label="LinkedIn">
                <i class="fab fa-linkedin"></i>
            </a>
            <a aria-label="Facebook">
                <i class="fab fa-facebook"></i>
            </a>
        </div>
        </div>
    </footer>

    <script>
        document.getElementById('feedbackForm').addEventListener('submit', function(e) {
            // Show alert message
            alert("Thank you for your feedback!");
            
            // Optional: Reset the form after submission
            this.reset();
            
            // In production, remove the reset() and let the form submit to Flask
            // For demo purposes, we'll prevent default submission
            e.preventDefault();
        });
    </script>

</body>
</html>
